name: Android CI & Automatic GitHub Release

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release Device Inspector APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode debug keystore if present
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || echo "Keystore decoded or fallback"
          fi

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace || gradle assembleDebug assembleRelease --stacktrace

      - name: Organize & Rename APK Outputs
        run: |
          mkdir -p release-apks
          VERSION_NAME="1.0.0"
          
          # Find generated APKs and copy with standardized naming
          if find app/build/outputs/apk/release -name "*.apk" | grep -q .; then
            cp app/build/outputs/apk/release/*.apk release-apks/DeviceInspector-v${VERSION_NAME}.apk
          elif find app/build/outputs/apk/debug -name "*.apk" | grep -q .; then
            cp app/build/outputs/apk/debug/*.apk release-apks/DeviceInspector-v${VERSION_NAME}.apk
          fi
          
          if find app/build/outputs/apk/debug -name "*.apk" | grep -q .; then
            cp app/build/outputs/apk/debug/*.apk release-apks/DeviceInspector-v${VERSION_NAME}-debug.apk
          fi

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeviceInspector-v1.0.0-APKs
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create / Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          name: Device Inspector v1.0.0
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release-apks/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
